<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e9f3ec"><title>SaltGuard · Cài đặt nâng cao</title><link rel="stylesheet" href="/static/farmer.css?v=mvp11"><link rel="stylesheet" href="/static/workspaces.css?v=mvp11"><link rel="stylesheet" href="/static/advanced-login.css?v=mvp11"><script defer src="/static/advanced-login.js?v=mvp11"></script></head>
<body><div class="app-shell"><header class="mobile-topbar"><div class="mobile-topbar-inner"><h1 class="mobile-topbar-title">Cài đặt nâng cao</h1><a class="pin-back" href="/?page=settings">Đóng</a></div></header><main class="pin-main"><div class="pin-icon" aria-hidden="true">▣</div><h2>Xác nhận quyền truy cập</h2><p>Nhập mã PIN 4 số để mở phần dành cho người thiết lập.</p>
<form id="pin-form" autocomplete="off"><label for="pin">Mã PIN</label><input id="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" minlength="4" autocomplete="off" required placeholder="••••" aria-describedby="pin-error"><div id="pin-error" class="pin-error" role="alert" aria-live="polite"></div><button type="submit" class="primary-btn" id="pin-submit">Mở cài đặt nâng cao</button></form><a class="pin-home" href="/?page=settings">Quay lại Cài đặt</a></main></div></body></html>
